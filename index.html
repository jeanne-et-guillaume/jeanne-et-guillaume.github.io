<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">

    <title>Mariage de Jeanne & Guillaume</title>
    
    <link rel="icon" type="image/png" href="icone.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&display=swap" rel="stylesheet">

    <style>
        /* --- VARIABLES COULEURS --- */
        :root {
            --col-titre: #89935e;
            --col-texte: #3e5076;
            --col-fond: #dde3df;
            --col-blanc: #ffffff;
            --col-accent-1: #95a5b2;
            --col-accent-2: #728b88;
            --font-main: 'Bradley Hand', 'Bradley Hand ITC', 'Caveat', cursive;
        }

        /* --- RESET & GLOBAL --- */
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--col-fond);
            color: var(--col-texte);
            font-family: var(--font-main);
            line-height: 1.6;
            font-size: 1rem; 
            overflow-x: hidden;
        }

        h1, h2, h3 {
            color: var(--col-titre);
            font-weight: bold;
            text-align: center;
            margin-bottom: 0.8rem;
        }

        h2 { font-size: 1.8rem; }

        a { color: var(--col-texte); text-decoration: none; transition: 0.3s; }

        /* --- HERO --- */
        .hero-container {
            position: relative;
            width: 100%;
            height: 60vh;
            overflow: hidden;
            background-color: var(--col-fond);
            margin: 0;
            padding: 0;
            top: 0;
        }

        .hero-scroller {
            width: 100%;
            height: 100%;
            background-image: url('fond.jpg'); 
            background-repeat: repeat-x;
            background-size: cover;
            background-position: center bottom;
            will-change: background-position;
            animation: scrollBackground 60s linear infinite;
            -webkit-mask-image: linear-gradient(to bottom, black 95%, transparent 100%);
            mask-image: linear-gradient(to bottom, black 95%, transparent 100%);
        }

        .hero-content {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 1.5rem 1rem 2rem 1rem;
            text-align: center;
            z-index: 2;
        }

        .hero-title {
            color: var(--col-blanc); 
            font-size: 2.8rem; 
            margin: 0;
            line-height: 1.1;
            text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.6);
        }

        .hero-subtitle {
            color: var(--col-blanc); 
            font-size: 1.6rem; 
            margin-top: 0.3rem;
            font-weight: bold;
            text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.6);
        }

        @keyframes scrollBackground {
            0% { background-position: 0 bottom; }
            100% { background-position: -100vw bottom; }
        }

        /* --- SECTIONS --- */
        .section-block {
            padding: 3rem 1rem;
            width: 100%;
        }

        .bg-light { background-color: var(--col-fond); }
        .bg-white { background-color: var(--col-blanc); }

        .container {
            max-width: 900px;
            margin: 0 auto;
            text-align: center;
        }

        /* --- COMPTE A REBOURS --- */
        #countdown {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 0;
            color: var(--col-accent-2);
            flex-wrap: wrap;
        }
        .time-box { display: flex; flex-direction: column; align-items: center; min-width: 50px; }
        .time-val { font-size: 1.6rem; font-weight: bold; color: var(--col-titre); }
        .time-label { font-size: 0.9rem; }
        
        .celebrate-msg {
            color: var(--col-texte);
            font-size: 3rem;
            font-weight: bold;
        }

        /* --- PROGRAMME --- */
        .event { margin-bottom: 2rem; }
        .event:last-child { margin-bottom: 0; }
        
        .event-time {
            color: var(--col-titre);
            font-weight: bold;
            font-size: 1.2rem;
            display: block;
            margin-bottom: 0.3rem;
        }
        
        .event-icon { 
            font-size: 2rem;
            display: block; 
            margin-bottom: 0.8rem;
            color: var(--col-accent-2);
        }
        .highlight { color: var(--col-accent-2); font-weight: bold; }

        /* --- BOUTON --- */
        .btn {
            display: inline-block;
            background-color: var(--col-titre);
            color: white;
            padding: 0.8rem 1.8rem; 
            border-radius: 50px;
            font-size: 1.1rem;
            margin-top: 1.2rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border: 2px solid transparent;
            cursor: pointer;
        }
        .btn:hover {
            background-color: transparent;
            color: var(--col-titre);
            border-color: var(--col-titre);
            transform: translateY(-2px);
        }

        /* --- GALERIE PHOTOS --- */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 12px;
            margin-top: 1.5rem;
        }

        .gallery-item {
            position: relative;
            overflow: hidden;
            border-radius: 8px;
            aspect-ratio: 1 / 1;
            background-color: rgba(0, 0, 0, 0.05);
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.08);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .gallery-item:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* --- LIGHTBOX --- */
        .lightbox {
            display: none;
            position: fixed;
            z-index: 999;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .lightbox.active { display: flex; }

        .lightbox-img {
            max-width: 90vw;
            max-height: 85vh;
            border-radius: 4px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.6);
        }

        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 25px;
            color: #ffffff;
            font-size: 2rem;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .lightbox-close:hover { transform: scale(1.2); }

        .lightbox-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: #ffffff;
            font-size: 2rem;
            background: rgba(0, 0, 0, 0.3);
            border: none;
            padding: 10px 15px;
            border-radius: 50%;
            cursor: pointer;
            transition: background 0.3s;
        }
        .lightbox-btn:hover { background: rgba(0, 0, 0, 0.7); }
        .lightbox-prev { left: 20px; }
        .lightbox-next { right: 20px; }

        /* --- FOOTER --- */
        footer {
            padding: 1.5rem;
            background-color: var(--col-accent-2);
            color: white;
            text-align: center;
            font-size: 0.9rem;
        }

        /* --- MEDIA QUERY DESKTOP --- */
        @media (min-width: 768px) {
            body { font-size: 1.2rem; }
            .hero-container { height: 80vh; }
            .hero-scroller {
                background-size: 100vw auto;
                background-position: left bottom;
            }
            .hero-content { padding-bottom: 5rem; }
            .hero-title { font-size: 5rem; }
            .hero-subtitle { font-size: 2.5rem; }
            h2 { font-size: 2.5rem; }
            .btn { font-size: 1.3rem !important; padding: 1rem 2.5rem !important; }
            .event-icon { font-size: 2.5rem !important; }
            .time-val { font-size: 2rem !important; }
            .gallery-grid {
                grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
                gap: 16px;
            }
        }
    </style>
</head>

    <!-- LIGHTBOX OVERLAY -->
    <div id="lightbox" class="lightbox" onclick="closeLightbox(event)">
        <span class="lightbox-close" onclick="closeLightbox(event)">&times;</span>
        <button class="lightbox-btn lightbox-prev" onclick="changeImage(-1, event)">&#10094;</button>
        <img id="lightbox-img" class="lightbox-img" src="" alt="Vue agrandie">
        <button class="lightbox-btn lightbox-next" onclick="changeImage(1, event)">&#10095;</button>
    </div>

    <footer>Jeanne & Guillaume - 2026</footer>

    <script>

        /* Visionneuse (Lightbox) */
        let currentImages = [];
        let currentIndex = 0;

        function openLightbox(element) {
            currentImages = Array.from(document.querySelectorAll('#gallery-grid .gallery-item img')).map(img => img.src);
            const clickedSrc = element.querySelector('img').src;
            currentIndex = currentImages.indexOf(clickedSrc);

            const lightbox = document.getElementById('lightbox');
            const lightboxImg = document.getElementById('lightbox-img');
            lightboxImg.src = clickedSrc;
            lightbox.classList.add('active');
        }

        function closeLightbox(event) {
            if (event.target.id === 'lightbox' || event.target.classList.contains('lightbox-close')) {
                document.getElementById('lightbox').classList.remove('active');
            }
        }

        function changeImage(direction, event) {
            event.stopPropagation();
            currentIndex += direction;
            if (currentIndex < 0) currentIndex = currentImages.length - 1;
            if (currentIndex >= currentImages.length) currentIndex = 0;
            document.getElementById('lightbox-img').src = currentImages[currentIndex];
        }

        /* Touches clavier (Échap, Flèches Gauche / Droite) */
        document.addEventListener('keydown', (e) => {
            const lightbox = document.getElementById('lightbox');
            if (lightbox.classList.contains('active')) {
                if (e.key === 'Escape') lightbox.classList.remove('active');
                if (e.key === 'ArrowLeft') changeImage(-1, e);
                if (e.key === 'ArrowRight') changeImage(1, e);
            }
        });
    </script>
